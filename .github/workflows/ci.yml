name: CI

on:
  push:
    branches: [main]
    paths:
      - "05-开发/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "05-开发/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-开发

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 05-开发/pnpm-lock.yaml

      - name: Install
        run: |
          node -v
          pnpm -v
          # pnpm 11 会把未批准的构建脚本当成错误（ERR_PNPM_IGNORED_BUILDS）：
          # 本仓库只有 esbuild 有 postinstall，而它只是校验二进制（平台包是 optionalDependency，
          # 不跑 postinstall 也能用，vite build 已实测通过）。所以这里统一跳过脚本。
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck (server + web)
        run: pnpm typecheck

      - name: Tests
        run: pnpm --filter @life/server test

      - name: Build web
        run: pnpm build
