name: Desktop release

# 打 tag（v1.2.3）时自动构建 Windows 安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（例如 0.2.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 05-开发

    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要比较上一个 tag，浅克隆拿不到历史
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 05-开发/pnpm-lock.yaml

      - name: Install workspace deps
        run: |
          node -v
          pnpm -v
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build web
        run: pnpm --filter @life/web build

      - name: Bundle server + web for desktop
        run: |
          node -e "console.log('esbuild:', require.resolve('esbuild'))"
          node apps/desktop/scripts/build.mjs

      # 把环境与结论写进运行摘要（公开页面可读）
      - name: Bundle summary
        if: always()
        shell: pwsh
        run: |
          "### Bundle 结果" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "node $(node -v) / pnpm $(pnpm -v)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Install packaging toolchain (electron + builder)
        working-directory: 05-开发/desktop-tools
        run: |
          pnpm install --config.node-linker=hoisted --ignore-scripts
          # electron 的二进制是 postinstall 下载的，这里显式补一次
          node node_modules/electron/install.js

      - name: Set version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart("v") }
          (Get-Content apps/desktop/package.json -Raw) -replace '"version":\s*"[^"]*"', ('"version": "' + $v + '"') | Set-Content apps/desktop/package.json -NoNewline
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package and publish
        working-directory: 05-开发/apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ../../desktop-tools/node_modules/electron-builder/out/cli/cli.js --win --publish always --config electron-builder.yml

      # 用提交记录生成 Release 说明，客户端更新弹窗会显示这段
      - name: Release notes from commits
        if: success()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            echo "## 本次更新（${PREV} → ${TAG}）" > notes.md
          else
            RANGE="${TAG}"
            echo "## 本次更新 ${TAG}" > notes.md
          fi
          echo "" >> notes.md
          git log ${RANGE} --no-merges --pretty=format:"- %s" >> notes.md
          echo "" >> notes.md
          echo "" >> notes.md
          echo "安装包见下方 Assets。" >> notes.md
          gh release edit "${TAG}" --notes-file notes.md

      # 只保留最近 3 个 Release（旧的一并删掉对应 tag）
      - name: Keep only latest 3 releases
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' > tags.txt
          echo "当前 Release："
          cat tags.txt
          tail -n +4 tags.txt | while read -r t; do
            [ -z "$t" ] && continue
            echo "删除旧版本 $t"
            gh release delete "$t" --yes --cleanup-tag || true
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: 05-开发/apps/desktop/release/*.exe
