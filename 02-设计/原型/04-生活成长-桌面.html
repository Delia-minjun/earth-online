 claims:[{id:100,reward:3,status:'已预约',schedule:'11月20日 19:00',reserved:45,price:60},{id:101,reward:2,status:'待安排',schedule:'未安排时间',reserved:0,price:40}],
 tasks:[{id:1,name:'完成设计方案第一部分',area:'study',coins:6,xp:20,done:false,min:'写出一个领域的定义'},{id:2,name:'出门散步一条熟悉的路线',area:'health',coins:3,xp:10,done:false,min:'出门走一小段'},{id:3,name:'整理这一周的账目',area:'finance',coins:6,xp:20,done:false,min:'核对一笔支出'}],
 entries:[{time:'11/15 15:20',text:'完成 · 项目页面梳理',area:'学业事业',amount:6},{time:'11/15 10:10',text:'完成 · 本周阅读笔记',area:'成长',amount:6},{time:'11/14 18:35',text:'兑换 · 看一场想看的电影',area:'现实奖励',amount:-60},{time:'11/13 20:40',text:'完成 · 阶段成果整理',area:'学业事业',amount:10}]};
let state=structuredClone(initial), lastFocus=null, toastTimer;
const threshold=a=>100+25*(a.level-1);
const remaining=()=>Math.max(0,state.budget-state.spent-state.reserved);
function render(){
 $('#balance').textContent=state.balance;$('#week-in').textContent=`本周 +${state.weekIn}`;$('#week-out').textContent=`本周 −${state.weekOut}`;$('#today-in').textContent=`今日 +${state.todayIn}`;
 const w=state.rewards.find(r=>r.id===state.wish);$('#wish-name').textContent=w?`下一个心愿 · ${w.name}`:'下一个心愿 · 待选择';$('#wish-count').textContent=w?`${state.balance} / ${w.price} 币`:'';$('#wish-progress').style.width=w?`${Math.min(100,state.balance/w.price*100)}%`:'0%';
 $('#budget-left').textContent=`¥${remaining()}`;$('#claims-tab').textContent=`已兑换 · ${state.claims.filter(c=>!['已取消','已体验'].includes(c.status)).length}`;
 $('#areas').innerHTML=state.areas.map(a=>`<button class="area" data-area="${a.id}" aria-label="${a.name}，等级${a.level}，本级${a.xp}/${threshold(a)}经验"><div class="area-top"><i class="dot" style="background:${a.color}"></i><b>${a.name}</b><span class="area-level">Lv.${a.level}</span></div><div class="bar"><i style="width:${a.xp/threshold(a)*100}%;background:${a.color}"></i></div><div class="area-bottom"><span>${a.xp} / ${threshold(a)} XP</span><span>近14天 · ${a.recent}次</span></div></button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));
 if(state.tab==='claims'){$('#shop').innerHTML=state.claims.filter(c=>c.status!=='已取消').map(c=>{const r=state.rewards.find(r=>r.id===c.reward);return `<article class="card reward claim"><div class="reward-top"><div class="reward-icon" style="--tone:${r.tone};--tint:${r.tint}">${icon(r.icon)}</div><div><div class="reward-title">${esc(r.name)}</div><div class="reward-meta">${esc(c.schedule)}</div></div></div><div class="reward-foot"><span class="claim-status">${c.status}</span><div>${c.status!=='已体验'?`<button class="textbtn" data-cancel="${c.id}">取消</button> <button class="btn soft" data-experience="${c.id}">已体验</button>`:'<span class="reward-meta">已留在生活足迹</span>'}</div></div></article>`}).join('')||'<div class="empty">还没有兑换的奖励</div>';
 }else{$('#shop').innerHTML=state.rewards.filter(r=>state.tab!=='wish'||r.id===state.wish).map(r=>`<article class="card reward"><div class="reward-top"><div class="reward-icon" style="--tone:${r.tone};--tint:${r.tint}">${icon(r.icon)}</div><div><div class="reward-title">${esc(r.name)}</div><div class="reward-meta">${r.money?'预计 ¥'+r.money:'无需额外花费'} · ${esc(r.time)}</div></div><button class="wish-toggle ${r.id===state.wish?'on':''}" data-wish="${r.id}" aria-label="${r.id===state.wish?'当前心愿：':'设为心愿：'}${esc(r.name)}" aria-pressed="${r.id===state.wish}">${icon('star')}</button></div><div class="reward-foot"><div class="price">${r.price}<small>币</small>${r.id===state.wish?'<span class="wishbadge">心愿</span>':''}</div><button class="btn ${state.balance>=r.price?'primary':''}" data-redeem="${r.id}" ${state.balance<r.price?'disabled':''}>${state.balance>=r.price?'兑换':'还差 '+(r.price-state.balance)+' 币'}</button></div></article>`).join('')||'<div class="empty">选择一项你期待的奖励作为心愿</div>'}
 $('#ledger').innerHTML=rows(state.entries.slice(0,4));
}
function rows(entries){return entries.map(e=>`<div class="ledger-row"><span class="time">${esc(e.time)}</span><span class="entry"><i class="dot" style="background:${e.amount<0?'var(--warn)':'var(--accent)'}"></i>${esc(e.text)}</span><span class="field">${esc(e.area)}</span><span class="amount ${e.amount<0?'out':''}">${e.amount>0?'+':'−'}${Math.abs(e.amount)}</span></div>`).join('')}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
function open(title,body,actions='',drawer=false){const d=$('#modal');if(!d.open)lastFocus=document.activeElement;d.className=drawer?'drawer':'';d.innerHTML=`<div class="dialoghead"><h2 id="dialog-title">${esc(title)}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div>${body}${actions?'<div class="dialog-actions">'+actions+'</div>':''}`;if(!d.open)d.showModal();d.querySelector('input,button')?.focus()}
function close(){$('#modal').close();lastFocus?.focus()}
function taskDrawer(){open('今日行动',`<div class="modes"><button class="btn ${!state.light?'soft':''}" data-mode="standard" aria-pressed="${!state.light}">标准</button><button class="btn ${state.light?'soft':''}" data-mode="light" aria-pressed="${state.light}">轻量</button></div><div class="summary">${state.tasks.filter(t=>t.done).length} / ${state.tasks.length} 已完成</div>${state.tasks.map(t=>{const a=state.areas.find(a=>a.id===t.area),c=state.light?3:t.coins,x=state.light?10:t.xp;return `<div class="taskrow"><div class="taskinfo"><b>${esc(state.light&&!t.done?t.min:t.name)}</b><small>${a.name} · ${t.done?'已记录':`+${c}币 · +${x}XP`}</small></div><button class="btn ${t.done?'':'soft'}" data-complete="${t.id}" ${t.done?'disabled':''}>${t.done?'已完成':'完成'}</button></div>`}).join('')}`,'',true)}
function addEntry(text,area,amount){state.entries.unshift({time:'11/15 16:00',text,area,amount})}
function complete(id){const t=state.tasks.find(t=>t.id===id);if(!t||t.done)return;const c=state.light?3:t.coins,x=state.light?10:t.xp,a=state.areas.find(a=>a.id===t.area);t.done=true;state.balance+=c;state.weekIn+=c;state.todayIn+=c;a.xp+=x;a.recent++;let level=false;while(a.xp>=threshold(a)){a.xp-=threshold(a);a.level++;level=true}addEntry('完成 · '+(state.light?t.min:t.name),a.name,c);render();taskDrawer();toast(`+${c}币 · ${a.name} +${x}XP${level?' · 升至 Lv.'+a.level:''}`)}
function redeemDialog(id){const r=state.rewards.find(r=>r.id===id);if(!r||state.balance<r.price)return;const enough=r.money<=remaining();open('兑换奖励',`<div class="reward-top" style="margin:8px 0 18px"><div class="reward-icon" style="--tone:${r.tone};--tint:${r.tint}">${icon(r.icon)}</div><b>${esc(r.name)}</b></div><div class="detailrow"><span>快乐币</span><b>${r.price} 币</b></div><div class="detailrow"><span>兑换后余额</span><b>${state.balance-r.price} 币</b></div><div class="detailrow"><span>预计费用 / 需要时间</span><b>¥${r.money} / ${esc(r.time)}</b></div><div class="detailrow"><span>本月预算剩余</span><b>¥${remaining()}</b></div>${!enough?'<p class="dialogtext">当前预算不足，可以调整预算或选择零费用奖励。</p>':''}`,`<button class="btn" data-action="close">再想想</button><button class="btn primary" data-confirm-redeem="${r.id}" ${!enough?'disabled':''}>兑换并存为待安排</button>`)}
function confirmRedeem(id){const r=state.rewards.find(r=>r.id===id);if(!r||state.balance<r.price||r.money>remaining())return;state.balance-=r.price;state.weekOut+=r.price;state.claims.unshift({id:Date.now(),reward:r.id,status:'待安排',schedule:'未安排时间',reserved:0,price:r.price});addEntry('兑换 · '+r.name,'现实奖励',-r.price);state.tab='claims';close();render();toast('已兑换，存入待安排奖励')}
function cancelClaim(id){const c=state.claims.find(c=>c.id===id);if(!c||['已体验','已取消'].includes(c.status))return;const r=state.rewards.find(r=>r.id===c.reward);open('取消奖励',`<p class="dialogtext">取消「${esc(r.name)}」并退回 <b>${c.price} 币</b>？此示例券尚未产生实际消费。</p>`,`<button class="btn" data-action="close">保留奖励</button><button class="btn primary" data-confirm-cancel="${id}">取消并退币</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.tab){state.tab=d.tab;render();return}if(d.wish){state.wish=Number(d.wish);render();toast('已更新下一个心愿');return}if(d.area){const a=state.areas.find(a=>a.id===d.area);open(a.name+' · 成长足迹',`<div class="detailrow"><span>当前等级</span><b>Lv.${a.level}</b></div><div class="detailrow"><span>本级经验</span><b>${a.xp} / ${threshold(a)} XP</b></div><div class="detailrow"><span>近14天的独立行动</span><b>${a.recent} 次</b></div><p class="dialogtext">示例记录 · ${a.id==='study'?'完成项目页面梳理':a.id==='health'?'完成一次户外散步':'完成一次自己选择的行动'}</p>`);return}
 if(d.mode){state.light=d.mode==='light';taskDrawer();return}if(d.complete){complete(Number(d.complete));return}if(d.redeem){redeemDialog(Number(d.redeem));return}if(d.confirmRedeem){confirmRedeem(Number(d.confirmRedeem));return}if(d.cancel){cancelClaim(Number(d.cancel));return}
 if(d.confirmCancel){const c=state.claims.find(c=>c.id===Number(d.confirmCancel));if(!c||['已取消','已体验'].includes(c.status))return;c.status='已取消';state.balance+=c.price;state.reserved-=c.reserved;c.reserved=0;addEntry('退回 · 取消奖励','奖励退回',c.price);close();render();toast(`已退回 ${c.price} 币`);return}
 if(d.experience){const c=state.claims.find(c=>c.id===Number(d.experience));if(!c||['已体验','已取消'].includes(c.status))return;open('记录奖励体验',`<p class="dialogtext">${esc(state.rewards.find(r=>r.id===c.reward).name)}</p><div class="detailrow"><span>这次体验的实际消费</span><b>示例中不记账</b></div>`,`<button class="btn" data-action="close">稍后记录</button><button class="btn primary" data-confirm-experience="${c.id}">标为已体验</button>`);return}
 if(d.confirmExperience){const c=state.claims.find(c=>c.id===Number(d.confirmExperience));if(!c||['已体验','已取消'].includes(c.status))return;c.status='已体验';state.reserved-=c.reserved;c.reserved=0;close();render();toast('已记录体验 · 未产生经验、金币或真实支出');return}
 switch(d.action){case'close':close();break;case'tasks':taskDrawer();break;case'home':state.tab='all';render();window.scrollTo({top:0});break;case'scope':toast('此原型展示生活成长页；其他模块沿用现有系统');break;case'reset':state=structuredClone(initial);render();toast('演示已重置');break;
 case'rules':open('成长与奖励规则',`<div class="dialogtext"><b>完成一次行动，结算一次奖励。</b><p>小行动：3币 / 10XP<br>标准行动：6币 / 20XP<br>困难行动：10币 / 35XP</p><p>同一任务的专注过程不重复发币。领域经验永久累计；快乐币兑换现实奖励。</p><p>基本休息和日常娱乐不需要兑换。兑换奖励不自动记真实支出，实际消费时再确认。</p></div>`);break;
 case'growth-rule':open('六领域成长',`<div class="dialogtext"><p>等级记录已经发生的投入；近期行动记录过去14天的参与情况。它们不评价人生是否合格。</p><p>升级所需经验：100 + 25 ×（当前等级 − 1）。未使用系统时，永久经验不减少。</p><p>点击任意领域可查看该领域的记录。</p></div>`);break;
 case'ledger':open('快乐币账本',`<div style="min-width:0">${rows(state.entries)}</div><div class="detailrow"><span>可用余额</span><b>${state.balance} 币</b></div>`);break;
 case'budget':open('奖励预算',`<div class="detailrow"><span>本月已确认支出</span><b>¥${state.spent}</b></div><div class="detailrow"><span>预约费用预留</span><b>¥${state.reserved}</b></div><label class="dialogtext" for="budget-input">本月预算上限</label><input id="budget-input" type="number" min="${state.spent+state.reserved}" value="${state.budget}"><p class="dialogtext">待安排且未指定日期的奖励尚未预留费用。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-budget">保存预算</button>`);break;
 case'save-budget':{const n=Number($('#budget-input').value);if(!Number.isFinite(n)||n<state.spent+state.reserved){toast('预算不能低于已有支出与预留');break}state.budget=Math.round(n);close();render();toast('演示预算已更新');break}
 case'add':open('添加奖励',`<label class="dialogtext" for="reward-name">奖励名称</label><input id="reward-name" maxlength="24" placeholder="一件你真正期待的事"><label class="dialogtext" for="reward-price">快乐币价格</label><input id="reward-price" type="number" min="1" value="30"><label class="dialogtext" for="reward-money">预计现实费用（元）</label><input id="reward-money" type="number" min="0" value="0">`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="save-reward">添加奖励</button>`);break;
 case'save-reward':{const name=$('#reward-name').value.trim(),price=Number($('#reward-price').value),money=Number($('#reward-money').value);if(!name||!Number.isFinite(price)||price<1||!Number.isFinite(money)||money<0){toast('请填写名称、正数币价和有效费用');break}state.rewards.push({id:Date.now(),name,price:Math.round(price),money:Math.round(money),time:'自选时间',icon:'star',tone:'#8d9c85',tint:'#eaf0e6'});state.tab='all';close();render();toast('奖励已添加到演示商店');break}
 }
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
render();
</script>
</body></html>
